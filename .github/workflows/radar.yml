# PONTE Funding Intelligence — Radar Multifuente v2
#
# O contrato TransfereGov v1 continua sendo publicado sem mudanças. Cada fonte
# v2 é coletada em um job isolado; a agregação registra falhas e preserva o dado
# anterior como stale, em vez de confundir erro de coleta com ausência de edital.

name: PONTE Funding Intelligence — Radar Multifuente

on:
  # O GitHub atrasa ou pula horários agendados (não rodou de 21 a 23/11/2026).
  # Três horários de reserva; o job `decidir` cancela os que chegam depois de
  # um catálogo publicado há menos de 10 h, então o dia tem uma coleta só.
  schedule:
    - cron: "30 12 * * *" # 12:30 UTC = 09:30 João Pessoa
    - cron: "17 16 * * *" # reserva
    - cron: "43 19 * * *" # reserva
  workflow_dispatch:
    inputs:
      carga_historica:
        description: "Ler uma vez os últimos 24 meses de encerradas em cada fonte (contrato 2.2)"
        type: boolean
        default: false
  pull_request:
    paths:
      - ".github/workflows/radar.yml"
      - "config/**"
      - "funding_intelligence/**"
      - "schema/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"

permissions:
  contents: write

concurrency:
  group: radar-oportunidades
  cancel-in-progress: false

jobs:
  decidir:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rodar: ${{ steps.idade.outputs.rodar }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: public/data/funding-opportunities-v2.json
          sparse-checkout-cone-mode: false
      - name: Catálogo de hoje já publicado?
        id: idade
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "rodar=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, datetime as dt
          try:
              gerado = json.load(open("public/data/funding-opportunities-v2.json"))["generated_at"]
              idade = dt.datetime.now(dt.timezone.utc) - dt.datetime.fromisoformat(gerado)
              recente = idade < dt.timedelta(hours=10)
          except Exception:
              recente = False
          print(f"rodar={'false' if recente else 'true'}")
          PY
          cat "$GITHUB_OUTPUT"

  test:
    needs: decidir
    if: ${{ needs.decidir.outputs.rodar == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Testar contrato, adapters, diff, stale e matching
        run: python -m unittest discover -s tests -v

  collect-transferegov:
    if: ${{ github.event_name != 'pull_request' }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Varredura TransfereGov
        run: |
          python scripts/radar.py \
            --uf PB \
            --saida saida \
            --estado public/data/estado.json \
            --cache .cache_radar

      - name: Publicar contrato legado v1.0
        run: |
          python scripts/publicar.py \
            --entrada saida/achados.json \
            --saida public/data/oportunidades.json

      - name: Validar contrato legado v1.0
        run: |
          python - <<'PY'
          import json, jsonschema
          schema = json.load(open("schema/oportunidades.schema.json"))
          payload = json.load(open("public/data/oportunidades.json"))
          jsonschema.validate(payload, schema, format_checker=jsonschema.FormatChecker())
          print(f"OK — {len(payload['oportunidades'])} oportunidades TransfereGov")
          PY

      - name: Gerar snapshot canônico TransfereGov
        run: |
          cp saida/estado.json public/data/estado.json
          python -m funding_intelligence.cli collect \
            --source transferegov \
            --input-v1 public/data/oportunidades.json \
            --output build/sources/transferegov.json \
            --strict

      - uses: actions/upload-artifact@v7
        with:
          name: funding-source-transferegov
          path: build/sources/transferegov.json
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: transferegov-public
          path: |
            public/data/oportunidades.json
            public/data/estado.json
          if-no-files-found: error

  collect-official-sources:
    if: ${{ github.event_name != 'pull_request' }}
    needs: test
    env:
      # Sites que recusam o GitHub são buscados pelo retransmissor do Fomenta360.
      FOMENTA360_RELAY_URL: https://fomenta360.vercel.app/api/coleta/relay
      FOMENTA360_CRON_SECRET: ${{ secrets.FOMENTA360_CRON_SECRET }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        source: [bndes, cnpq, embrapii, fapemig, fapesq, finep, pdil, pncp-cpsi, dou-chamadas, eu-horizon, querido-diario, ppsus, transferegov-especiais, transferegov-fundoafundo, transferegov-parcerias, capes, senai-inovacao, fapeal, fapesb, fapema, fapespa, fapepi, fapesc, fapeg, fapitec, fapes, fapt, fapergs, fapac, fundect, fapdf, fapeam, fapemat, araucaria, fapeap, facepe, fapern, faperr, rnp, fundo-amazonia, inovativa, anp-premio, fbb, petrobras-socioambiental, brde-fundo-verde, serrapilheira, funbio, ics, fundo-casa, itau-social, open-startups, bnb-fundeci, basa-fno, goias-fomento, sebrae-rs, sct-ce, secti-ma, belmont-forum, confap, fapesp, faperj]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # A Finep publica a lista de documentos só para quem tem token; o coletor lê a
      # página pública renderizada (ver funding_intelligence/adapters/finep.py).
      - name: Navegador para os documentos da Finep
        if: ${{ matrix.source == 'finep' }}
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Coletar ${{ matrix.source }}
        env:
          # Só no disparo manual com a caixa marcada; a rodada agendada lê a vitrine do dia.
          RADAR_CARGA_HISTORICA: ${{ github.event_name == 'workflow_dispatch' && inputs.carga_historica && '1' || '0' }}
        run: |
          python -m funding_intelligence.cli collect \
            --source "${{ matrix.source }}" \
            --output "build/sources/${{ matrix.source }}.json"
      - uses: actions/upload-artifact@v7
        with:
          name: funding-source-${{ matrix.source }}
          path: build/sources/${{ matrix.source }}.json
          if-no-files-found: error

  aggregate-and-publish:
    needs: [collect-transferegov, collect-official-sources]
    if: ${{ always() && needs.collect-transferegov.result == 'success' }}
    env:
      # Sites que recusam o GitHub são buscados pelo retransmissor do Fomenta360.
      FOMENTA360_RELAY_URL: https://fomenta360.vercel.app/api/coleta/relay
      FOMENTA360_CRON_SECRET: ${{ secrets.FOMENTA360_CRON_SECRET }}
    runs-on: ubuntu-latest
    # A conversão dos editais em Markdown (Docling, CPU) leva a maior parte.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v8
        with:
          pattern: funding-source-*
          path: build/sources
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: transferegov-public
          path: public/data

      # Fontes que só respondem a IP brasileiro vêm do workflow radar-brasil.yml
      # (executor no Brasil). Resultado saudável com menos de 36 h substitui a
      # tentativa feita daqui, que o site recusa.
      - name: Usar fontes coletadas no Brasil
        run: |
          python - <<'PY'
          import json, glob, shutil, datetime as dt
          agora = dt.datetime.now(dt.timezone.utc)
          for f in sorted(glob.glob("public/data/fontes-brasil/*.json")):
              d = json.load(open(f))
              fonte = d["source"]["id"]
              idade = agora - dt.datetime.fromisoformat(d["checked_at"])
              if d.get("status") == "healthy" and idade < dt.timedelta(hours=36):
                  shutil.copy(f, f"build/sources/{fonte}.json")
                  print(f"{fonte}: resultado do Brasil ({len(d.get('opportunities', []))} oportunidades, {idade.total_seconds() / 3600:.0f} h)")
              else:
                  print(f"::warning::{fonte}: resultado do Brasil não usado ({d.get('status')}, {idade.total_seconds() / 3600:.0f} h)")
          PY

      - name: Agregar, deduplicar, comparar, fazer matching e validar v2
        run: |
          python -m funding_intelligence.cli aggregate \
            --inputs "build/sources/*.json" \
            --previous public/data/funding-opportunities-v2.json \
            --portfolios config/portfolios.json \
            --schema schema/funding-opportunity-2.2.schema.json \
            --output public/data/funding-opportunities-v2.json

      # Edital em PDF -> Markdown. O PDF não é guardado: fica o Markdown, o link
      # oficial e o hash do arquivo (scripts/editais_markdown.py).
      - name: Cache dos modelos do Docling e do EasyOCR
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/docling
            ~/.cache/huggingface
            ~/.EasyOCR
          key: modelos-docling-${{ hashFiles('requirements-editais.txt') }}

      # Instalação fora do passo de conversão: o teto de 45 min abaixo é só para
      # converter (a instalação do Docling e do torch leva alguns minutos).
      - name: Instalar o conversor de editais
        id: instalar_editais
        continue-on-error: true
        run: pip install -r requirements-editais.txt

      - name: Editais em Markdown
        id: editais
        if: ${{ steps.instalar_editais.outcome == 'success' }}
        continue-on-error: true
        # O script só começa um edital se ele couber inteiro nos 40 min (cada um
        # tem teto de 8 min); este limite é a segurança final, com sobra para o commit.
        timeout-minutes: 45
        # O script fica em scripts/ e importa o pacote da raiz: sem isto o
        # Python não acha funding_intelligence (falhava em toda execução).
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/editais_markdown.py \
            --catalogo public/data/funding-opportunities-v2.json \
            --saida public/data/editais \
            --max 30 \
            --limite-minutos 40 \
            --max-minutos-por-edital 8

      # continue-on-error não pode esconder a falha: avisa no resumo da execução.
      - name: Conferir o índice dos editais
        run: |
          if [ "${{ steps.editais.outcome }}" != "success" ]; then
            echo "::warning::Conversão dos editais em Markdown falhou (${{ steps.editais.outcome }}). O catálogo segue publicado sem os textos."
          fi
          if [ ! -f public/data/editais/indice.json ]; then
            echo "::warning::public/data/editais/indice.json não foi gerado."
          else
            python -c "import json; print('Editais no índice:', len(json.load(open('public/data/editais/indice.json'))))"
          fi

      - name: Resumo operacional
        run: |
          python - <<'PY'
          import json
          data = json.load(open("public/data/funding-opportunities-v2.json"))
          print(json.dumps(data["summary"], ensure_ascii=False, indent=2))
          for source in data["sources"]:
              print(f"{source['name']}: {source['status']} ({source['opportunity_count']})")
          PY

      - name: Commit se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          if git diff --staged --quiet; then
            echo "Nenhuma alteração nos dados hoje."
          else
            git commit -m "chore(radar): atualiza catálogo multifuente [skip ci]"
            # O workflow das fontes do Brasil também grava na main.
            for tentativa in 1 2 3; do
              git pull --rebase origin main && git push && break
              sleep $((tentativa * 10))
            done
          fi

      # Avisa o Fomenta360 que o catálogo mudou. A rota de importação lê o
      # funding-opportunities-v2.json deste repositório e manda o que for novo ou
      # alterado para a fila de revisão humana. Sem os dois segredos, o aviso não
      # sai e o Fomenta360 depende do cron diário dele.
      - name: Avisar o Fomenta360
        if: ${{ github.event_name != 'pull_request' }}
        env:
          IMPORT_URL: ${{ secrets.FOMENTA360_IMPORT_URL }}
          CRON_SECRET: ${{ secrets.FOMENTA360_CRON_SECRET }}
        run: |
          if [ -z "$IMPORT_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::FOMENTA360_IMPORT_URL ou FOMENTA360_CRON_SECRET ausente — o Fomenta360 vai depender do cron dele."
            exit 0
          fi
          curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET" "$IMPORT_URL"
          echo "Importação no Fomenta360 disparada."
