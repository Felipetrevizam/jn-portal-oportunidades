# PONTE Funding Intelligence — Radar Multifuente v2
#
# O contrato TransfereGov v1 continua sendo publicado sem mudanças. Cada fonte
# v2 é coletada em um job isolado; a agregação registra falhas e preserva o dado
# anterior como stale, em vez de confundir erro de coleta com ausência de edital.

name: PONTE Funding Intelligence — Radar Multifuente

on:
  schedule:
    - cron: "30 12 * * *" # 12:30 UTC = 09:30 João Pessoa
  workflow_dispatch:
    inputs:
      carga_historica:
        description: "Ler uma vez os últimos 24 meses de encerradas em cada fonte (contrato 2.2)"
        type: boolean
        default: false
  pull_request:
    paths:
      - ".github/workflows/radar.yml"
      - "config/**"
      - "funding_intelligence/**"
      - "schema/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"

permissions:
  contents: write

concurrency:
  group: radar-oportunidades
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Testar contrato, adapters, diff, stale e matching
        run: python -m unittest discover -s tests -v

  collect-transferegov:
    if: ${{ github.event_name != 'pull_request' }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Varredura TransfereGov
        run: |
          python scripts/radar.py \
            --uf PB \
            --saida saida \
            --estado public/data/estado.json \
            --cache .cache_radar

      - name: Publicar contrato legado v1.0
        run: |
          python scripts/publicar.py \
            --entrada saida/achados.json \
            --saida public/data/oportunidades.json

      - name: Validar contrato legado v1.0
        run: |
          python - <<'PY'
          import json, jsonschema
          schema = json.load(open("schema/oportunidades.schema.json"))
          payload = json.load(open("public/data/oportunidades.json"))
          jsonschema.validate(payload, schema, format_checker=jsonschema.FormatChecker())
          print(f"OK — {len(payload['oportunidades'])} oportunidades TransfereGov")
          PY

      - name: Gerar snapshot canônico TransfereGov
        run: |
          cp saida/estado.json public/data/estado.json
          python -m funding_intelligence.cli collect \
            --source transferegov \
            --input-v1 public/data/oportunidades.json \
            --output build/sources/transferegov.json \
            --strict

      - uses: actions/upload-artifact@v7
        with:
          name: funding-source-transferegov
          path: build/sources/transferegov.json
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: transferegov-public
          path: |
            public/data/oportunidades.json
            public/data/estado.json
          if-no-files-found: error

  collect-official-sources:
    if: ${{ github.event_name != 'pull_request' }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        source: [bndes, cnpq, embrapii, fapemig, fapesq, finep, pdil, pncp-cpsi, dou-chamadas, eu-horizon, ppsus, transferegov-especiais, transferegov-fundoafundo, transferegov-parcerias, capes, senai-inovacao, fapeal, fapesb, fapema, fapespa, fapepi, fapesc, fapeg, fapitec, fapes, fapt, fapergs, fapac, fundect, fapdf, fapeam, fapemat, araucaria, facepe, fapern, faperr, rnp, fundo-amazonia, fbb, petrobras-socioambiental, brde-fundo-verde, serrapilheira, funbio, ics, fundo-casa, itau-social, open-startups, bnb-fundeci, sebrae-rs, sct-ce, secti-ma, confap, fapesp, faperj]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # A Finep publica a lista de documentos só para quem tem token; o coletor lê a
      # página pública renderizada (ver funding_intelligence/adapters/finep.py).
      - name: Navegador para os documentos da Finep
        if: ${{ matrix.source == 'finep' }}
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Coletar ${{ matrix.source }}
        env:
          # Só no disparo manual com a caixa marcada; a rodada agendada lê a vitrine do dia.
          RADAR_CARGA_HISTORICA: ${{ github.event_name == 'workflow_dispatch' && inputs.carga_historica && '1' || '0' }}
        run: |
          python -m funding_intelligence.cli collect \
            --source "${{ matrix.source }}" \
            --output "build/sources/${{ matrix.source }}.json"
      - uses: actions/upload-artifact@v7
        with:
          name: funding-source-${{ matrix.source }}
          path: build/sources/${{ matrix.source }}.json
          if-no-files-found: error

  aggregate-and-publish:
    needs: [collect-transferegov, collect-official-sources]
    if: ${{ always() && needs.collect-transferegov.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v8
        with:
          pattern: funding-source-*
          path: build/sources
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: transferegov-public
          path: public/data

      - name: Agregar, deduplicar, comparar, fazer matching e validar v2
        run: |
          python -m funding_intelligence.cli aggregate \
            --inputs "build/sources/*.json" \
            --previous public/data/funding-opportunities-v2.json \
            --portfolios config/portfolios.json \
            --schema schema/funding-opportunity-2.2.schema.json \
            --output public/data/funding-opportunities-v2.json

      - name: Resumo operacional
        run: |
          python - <<'PY'
          import json
          data = json.load(open("public/data/funding-opportunities-v2.json"))
          print(json.dumps(data["summary"], ensure_ascii=False, indent=2))
          for source in data["sources"]:
              print(f"{source['name']}: {source['status']} ({source['opportunity_count']})")
          PY

      - name: Commit se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          if git diff --staged --quiet; then
            echo "Nenhuma alteração nos dados hoje."
          else
            git commit -m "chore(radar): atualiza catálogo multifuente [skip ci]"
            git push
          fi

      # Avisa o Fomenta360 que o catálogo mudou. A rota de importação lê o
      # funding-opportunities-v2.json deste repositório e manda o que for novo ou
      # alterado para a fila de revisão humana. Sem os dois segredos, o aviso não
      # sai e o Fomenta360 depende do cron diário dele.
      - name: Avisar o Fomenta360
        if: ${{ github.event_name != 'pull_request' }}
        env:
          IMPORT_URL: ${{ secrets.FOMENTA360_IMPORT_URL }}
          CRON_SECRET: ${{ secrets.FOMENTA360_CRON_SECRET }}
        run: |
          if [ -z "$IMPORT_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::FOMENTA360_IMPORT_URL ou FOMENTA360_CRON_SECRET ausente — o Fomenta360 vai depender do cron dele."
            exit 0
          fi
          curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET" "$IMPORT_URL"
          echo "Importação no Fomenta360 disparada."
